server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # React app - handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API routes to the Node backend
    location ~ ^/(register|login|logout|me|user|confirm|confirmUser|verify-email|contact|upload|createBooking|updateBooking|deleteBooking|getBooking|createTable|updateTable|deleteTable|getTable|createMenuItem|updateMenuItem|deleteMenuItem|getMenu) {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
